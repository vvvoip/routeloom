name: Publish website
on:
  push:
    branches: [main]
    paths: ['website/**', 'packaging/release.json', 'scripts/site.test.mjs', 'scripts/check-site-release.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Five-platform client builds']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node website/build.mjs
      - run: node --test scripts/site.test.mjs
      - name: Verify download links are available
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-site-release.mjs
      - if: steps.release.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.release.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
