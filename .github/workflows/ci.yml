name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo run -p routeloom-cli -- check examples/default.rules
      - run: cargo run -p routeloom-cli -- explain examples/default.rules blocked.example
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node website/build.mjs
      - run: node --test scripts/site.test.mjs scripts/localization.test.mjs scripts/release.test.mjs
      - run: python3 scripts/test-apple-diagnostics.py
  client-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/client
      - run: flutter gen-l10n
        working-directory: apps/client
      - run: flutter test
        working-directory: apps/client

  vpn-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo build -p routeloom-vpn --locked
      - run: sudo apt-get update && sudo apt-get install -y nftables
      - run: sudo bash scripts/test-vpn-linux.sh
