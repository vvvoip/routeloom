name: routeloom
description: RouteLoom bilingual client foundation for five platforms.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  cryptography: ^2.9.0
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/RUST-LICENSES.txt
