[package]
name = "routeloom-vpn"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
sha2 = "0.10"
routeloom-engine = { path = "../engine" }
routeloom-tunnel = { path = "../tunnel" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = { version = "2", features = ["serde"] }
tun = { version = "0.8.14", features = ["async"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Rpc", "Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }

[target.'cfg(target_os = "windows")'.dependencies.zip]
version = "=8.6.0"
default-features = false
features = ["deflate"]
